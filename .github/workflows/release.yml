# Every push to main builds a new SpotiTinder.ipa, publishes it as a GitHub release,
# and adds it to altstore-source.json so AltStore offers the update.
name: Build & publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "altstore-source.json"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build IPA
        run: scripts/build-ipa.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/SpotiTinder.ipa \
            --title "SpotiTinder $VERSION" \
            --notes "$(git log -1 --pretty=%B)"

      - name: Update AltStore source
        run: |
          python3 scripts/update-source.py \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/SpotiTinder.ipa" \
            --size "$(stat -f%z dist/SpotiTinder.ipa)" \
            --notes "$(git log -1 --pretty=%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore-source.json
          git commit -m "AltStore source: $VERSION [skip ci]"
          git pull --rebase
          git push
